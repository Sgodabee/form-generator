# ============================================================
# Server
# ============================================================
server.port=8081



spring.datasource.url=jdbc:postgresql://localhost:5433/formgenerator
spring.datasource.username=postgres
spring.datasource.password=M@goda
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# RabbitMQ  matches docker-compose.yml service
# ============================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ============================================================
# Amazon S3 / LocalStack
# ============================================================
# Point to LocalStack; remove this line to use real AWS S3
app.s3.endpoint=http://localhost:4566
app.s3.region=us-east-1
app.s3.bucket-name=form-generator-bucket
# LocalStack dummy credentials (real AWS: use env vars / IAM)
app.s3.access-key=test
app.s3.secret-key=test

# ============================================================
# Application  file paths
# ============================================================
# Absolute path to the CSV input file
app.csv.input-path=${user.dir}/src/main/resources/csv-input/sample_data.csv

# Directory where generated PDFs are saved locally
app.local.output-dir=${user.dir}/src/main/resources/pdf-output

# ============================================================
# Jackson  serialize LocalDateTime as ISO string
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Johannesburg

# ============================================================
# Logging
# ============================================================
logging.level.com.ir.formgenerator=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
