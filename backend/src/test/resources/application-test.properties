# ============================================================
# Test profile — no external infrastructure required
# ============================================================

# H2 in-memory database for repository tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable RabbitMQ auto-connect during unit tests
spring.rabbitmq.host=localhost
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Dummy S3 config (mocked in tests)
app.s3.endpoint=http://localhost:4566
app.s3.region=us-east-1
app.s3.bucket-name=test-bucket
app.s3.access-key=test
app.s3.secret-key=test

# File paths (not used in unit tests — collaborators are mocked)
app.csv.input-path=/tmp/test.csv
app.local.output-dir=/tmp/pdf-output

logging.level.com.ir.formgenerator=WARN
